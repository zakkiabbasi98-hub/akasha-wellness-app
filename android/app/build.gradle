plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase (optional) — uncomment after docs/FIREBASE_SETUP.md steps 1-3
    // id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.akasha.wellness"
    // Android 16 (API 36). Required by the current Play Store target rules and
    // by AndroidX releases that every plugin in this graph now pulls in.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // JDK 21 is the toolchain this app builds with. Bytecode target stays at
        // 17: AGP 8.11, D8/R8 and core library desugaring are all fully
        // supported there, and 17 keeps every plugin's own bytecode compatible.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true // required by flutter_local_notifications
    }

    // NOTE: `kotlinOptions {}` was removed — Kotlin 2.2 raises that DSL to an
    // *error*. The replacement is the `compilerOptions {}` block, declared
    // below the `android {}` block (it belongs to the Kotlin extension, not to
    // Android's). jvmTarget stays 17 to match `compileOptions` above; a
    // mismatch is the "Inconsistent JVM-target compatibility" build failure.

    defaultConfig {
        applicationId = "com.akasha.wellness"
        minSdk = 23          // local_auth + notification permission fallbacks
        targetSdk = 36       // Android 16
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        // Release signing is read from android/key.properties (never committed).
        // See docs/BUILD_AND_RELEASE.md
        if (rootProject.file("key.properties").exists()) {
            def keystoreProperties = new Properties()
            rootProject.file("key.properties").withReader("UTF-8") { keystoreProperties.load(it) }
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug signing so `flutter build apk --release`
            // works out of the box; configure key.properties before publishing.
            signingConfig = rootProject.file("key.properties").exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Kotlin 2.2 DSL (replaces the removed `android { kotlinOptions { } }` block).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 2.1.x is required by the AndroidX libraries that compileSdk 36 pulls in;
    // 2.0.4 fails with "dependency requires desugaring library version 2.1.4".
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
