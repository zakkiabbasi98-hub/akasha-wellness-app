pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Version pairing (all three must move together):
    //   AGP 8.1.0  ←→ Gradle 8.3   ←→ JDK 17
    // Gradle is pinned in gradle/wrapper/gradle-wrapper.properties; the JDK is
    // whatever `flutter doctor` reports for Android Studio (17+ is required by
    // AGP 8.x). Kotlin 1.9.10 is the version Flutter 3.16–3.24 templates use.
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
    // Firebase (optional). Uncomment together with the apply line in app/build.gradle
    // after adding google-services.json — see docs/FIREBASE_SETUP.md
    // id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
