distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Matches the Android Gradle Plugin declared in android/settings.gradle.
# AGP 8.11.1 requires Gradle 8.13 or newer and runs on JDK 17-21; this project
# builds with JDK 21. Gradle 8.14 is the 8.x line's final release, which keeps
# this on AGP 8 (not AGP 9, whose built-in Kotlin support would break the
# plugins in this dependency graph). Do not bump one without the other.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
networkTimeout=60000
validateDistributionUrl=true
