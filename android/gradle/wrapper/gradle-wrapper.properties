distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Matches the Android Gradle Plugin declared in android/settings.gradle.
# AGP 8.1.0 requires Gradle 8.0+ and JDK 17; 8.3 is the version Flutter 3.16+
# templates ship with, so this pairing is known-good. Do not bump one without
# the other.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
networkTimeout=60000
validateDistributionUrl=true
